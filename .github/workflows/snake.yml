name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Génération du snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8000ff&color_dots=#f3e8ff,#e0b3ff,#c266ff,#b026ff,#8000ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f3ff&color_dots=#1a0a2e,#3d0066,#8000ff,#b026ff,#df00fe&color_background=#0d0221

      - name: Publication sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
